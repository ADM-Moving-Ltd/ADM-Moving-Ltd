<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ADM Moving LTD</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
body{margin:0;font-family:Arial;background:#f5f7fb;}
.container{width:92%;max-width:1200px;margin:auto;}

.navbar{background:#28c76f;padding:15px;color:white;display:flex;justify-content:space-between;}
.navbar a{color:white;margin:0 10px;text-decoration:none;}

.hero{padding:80px 20px;text-align:center;background:#1e293b;color:white;}

.section{padding:50px 0;}

.services{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:20px;}

.service-card{background:white;padding:20px;border-radius:10px;}

.dashboard{display:grid;grid-template-columns:1fr 1fr;gap:20px;}

.card{background:white;padding:20px;border-radius:12px;}

.item-control{display:flex;justify-content:space-between;padding:10px;background:#f1f5f9;margin:10px 0;border-radius:8px;}

.item-buttons{display:flex;gap:10px;align-items:center;}

.btn-plus,.btn-minus{width:30px;height:30px;cursor:pointer;}

.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;}

.calendar .day{padding:10px;text-align:center;background:#eee;cursor:pointer;border-radius:6px;}

.calendar .selected{background:#28c76f;color:white;}

footer{background:#1e293b;color:white;text-align:center;padding:20px;margin-top:40px;}
</style>
</head>

<body>

<!-- NAV -->
<div class="navbar">
<div>ADM Moving LTD</div>
<div>
<a href="#home">Home</a>
<a href="#services">Services</a>
<a href="#book">Booking</a>
</div>
</div>

<!-- HERO -->
<div class="hero" id="home">
<h1>Professional Moving Services</h1>
<p>Fast & reliable UK removals</p>
</div>

<!-- SERVICES -->
<div class="section" id="services">
<div class="container">
<h2>Services</h2>

<div class="services">
<div class="service-card">House Moving</div>
<div class="service-card">Office Moving</div>
<div class="service-card">Packing Service</div>
</div>

</div>
</div>

<!-- BOOKING -->
<div class="section" id="book">
<div class="container">

<div class="dashboard">

<!-- CALCULATOR -->
<div class="card">

<h3>Moving Calculator</h3>

<div class="item-control">
<span>Sofa</span>
<div class="item-buttons">
<button class="btn-minus" data-name="Sofa" data-volume="3">-</button>
<span class="item-count">0</span>
<button class="btn-plus" data-name="Sofa" data-volume="3">+</button>
</div>
</div>

<div class="item-control">
<span>TV</span>
<div class="item-buttons">
<button class="btn-minus" data-name="TV" data-volume="1.5">-</button>
<span class="item-count">0</span>
<button class="btn-plus" data-name="TV" data-volume="1.5">+</button>
</div>
</div>

<input id="distance" placeholder="Distance (miles)" oninput="calc()">

<select id="van" onchange="calc()">
<option value="1">Small Van</option>
<option value="1.3">Medium Van</option>
<option value="1.6">Large Van</option>
</select>

<div>Volume: <span id="vol">0</span> m³</div>
<div>Total: £<span id="total">0</span></div>

</div>

<!-- BOOK -->
<div class="card">

<h3>Book Move</h3>

<input id="name" placeholder="Name">
<input id="phone" placeholder="Phone">
<input id="email" placeholder="Email">

<div class="calendar" id="calendar"></div>

<button onclick="book()">Confirm</button>

<p id="msg" style="display:none;color:green;">Sent</p>

</div>

</div>

</div>
</div>

<!-- FOOTER -->
<footer>
ADM Moving LTD © 2026
</footer>

<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

<script>
emailjs.init("rWnJNR9pMWg8bBMLM");

let vol=0;
let base=0;
let items={};
let selectedDate=null;

const PRICE_PER_MILE=1.5;

/* ITEMS */
document.addEventListener("click",(e)=>{
if(!e.target.dataset.name)return;

let name=e.target.dataset.name;
let volu=parseFloat(e.target.dataset.volume);

if(!items[name])items[name]=0;

let parent=e.target.parentElement;
let count=parent.querySelector(".item-count");

if(e.target.classList.contains("btn-plus")){
items[name]++;vol+=volu;base+=volu*45;
}

if(e.target.classList.contains("btn-minus")&&items[name]>0){
items[name]--;vol-=volu;base-=volu*45;
}

count.textContent=items[name];
calc();
});

/* CALC */
function calc(){
let d=document.getElementById("distance").value||0;
let v=document.getElementById("van").value||1;

let total=(base+d*PRICE_PER_MILE)*v;

document.getElementById("vol").innerText=vol.toFixed(1);
document.getElementById("total").innerText=total.toFixed(0);
}

/* CALENDAR */
function renderCalendar(){
let cal=document.getElementById("calendar");
cal.innerHTML="";

let now=new Date();
let y=now.getFullYear();
let m=now.getMonth();

let days=new Date(y,m+1,0).getDate();
let today=new Date();today.setHours(0,0,0,0);

for(let i=1;i<=days;i++){
let d=document.createElement("div");
d.className="day";
d.textContent=i;

let date=new Date(y,m,i);

if(date<today)d.style.opacity="0.3";
else d.onclick=()=>{selectedDate=date;renderCalendar();};

if(selectedDate&&selectedDate.getDate()==i)d.classList.add("selected");

cal.appendChild(d);
}
}

/* BOOK */
function book(){
let name=document.getElementById("name").value;
let phone=document.getElementById("phone").value;
let email=document.getElementById("email").value;

if(!name||!phone||!selectedDate){
alert("Fill all fields");
return;
}

let msg=`Move Request:
Name:${name}
Phone:${phone}
Date:${selectedDate.toLocaleDateString("en-GB")}
Volume:${vol}
Total:£${document.getElementById("total").innerText}`;

window.open("https://wa.me/447312814746?text="+encodeURIComponent(msg));

emailjs.send("service_h4eoz48","template_01mylzs",{name,phone,email,message:msg});

document.getElementById("msg").style.display="block";
}

window.onload=()=>{renderCalendar();calc();};
</script>

</body>
</html>
