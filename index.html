<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ADM Moving LTD | Business System v2</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="https://cdn.emailjs.com/dist/email.min.js"></script>

<script>
(function(){
emailjs.init("YOUR_PUBLIC_KEY");
})();
</script>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Poppins,sans-serif;}

body{background:#eef3fb;color:#1f2937;}

header{
background:#081c3a;color:white;text-align:center;padding:20px;
}

nav{
background:#10284d;text-align:center;padding:12px;position:sticky;top:0;
}

nav a{
color:white;margin:0 15px;text-decoration:none;font-weight:600;
}

.hero{
height:80vh;
background:linear-gradient(rgba(0,0,0,0.55),rgba(0,0,0,0.55)),
url('https://images.unsplash.com/photo-1600585154526-990dced4db0d?auto=format&fit=crop&w=1600&q=80');
background-size:cover;
display:flex;align-items:center;justify-content:center;
text-align:center;color:white;
}

section{padding:60px 10%;}

.box{
background:white;padding:25px;border-radius:12px;max-width:900px;margin:auto;
}

input,select,textarea{
width:100%;padding:12px;margin:8px 0;border-radius:8px;border:1px solid #ccc;
}

button{
width:100%;padding:15px;background:#22c55e;color:white;border:none;
border-radius:10px;font-weight:700;cursor:pointer;
}

button:hover{background:#16a34a;}

#map{height:350px;margin-top:20px;border-radius:12px;}

.result{
font-size:22px;margin-top:15px;font-weight:700;color:#081c3a;
}

footer{
background:#081c3a;color:white;text-align:center;padding:20px;
}
</style>
</head>

<body>

<header>
<h1>🚚 ADM Moving LTD</h1>
<p>Business System v2 - Automated Booking Platform</p>
</header>

<nav>
<a href="#booking">Booking</a>
<a href="#map">Map</a>
</nav>

<div class="hero">
<div>
<h1>Smart Booking System</h1>
<p>Instant price • Distance • Email automation</p>
</div>
</div>

<!-- BOOKING -->
<section id="booking">

<div class="box">

<h2>Book Your Move</h2>

<form id="form">

<input name="name" placeholder="Full Name" required>
<input name="phone" placeholder="Phone Number" required>
<input name="email" placeholder="Email" required>

<input type="date" name="date" id="date" required>

<input name="from" id="from" placeholder="Moving From" required>
<input name="to" id="to" placeholder="Moving To" required>

<textarea name="details" placeholder="Extra details"></textarea>

<h3>Inventory</h3>

<input type="number" id="sofa" placeholder="Sofa" value="0">
<input type="number" id="bed" placeholder="Bed" value="0">
<input type="number" id="wardrobe" placeholder="Wardrobe" value="0">
<input type="number" id="boxes" placeholder="Boxes" value="0">

<button type="button" onclick="calculate()">Calculate Price</button>

<div class="result" id="result">Price: £0</div>

<button type="submit">Confirm Booking</button>

</form>

</div>

</section>

<!-- MAP -->
<section>
<h2 style="text-align:center;">Route Map</h2>
<div id="map"></div>
</section>

<footer>
© 2026 ADM Moving LTD
</footer>

<script>

/* MAP INIT */
let map = L.map('map').setView([51.5,-0.12],6);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
attribution:'OSM'
}).addTo(map);

let m1,m2,line;

/* GEO */
async function geo(addr){
let r = await fetch("https://nominatim.openstreetmap.org/search?format=json&q="+addr);
let d = await r.json();
if(!d[0]) return null;
return [parseFloat(d[0].lat),parseFloat(d[0].lon)];
}

/* DISTANCE */
function dist(a,b,c,d){
const R=3959;
const dLat=(c-a)*Math.PI/180;
const dLon=(d-b)*Math.PI/180;
const x=Math.sin(dLat/2)**2 +
Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*
Math.sin(dLon/2)**2;
return 2*R*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));
}

/* PRICE CALC */
async function calculate(){

let from=document.getElementById("from").value;
let to=document.getElementById("to").value;

let a=await geo(from);
let b=await geo(to);

if(!a||!b){
alert("Invalid address");
return;
}

if(m1) map.removeLayer(m1);
if(m2) map.removeLayer(m2);
if(line) map.removeLayer(line);

m1=L.marker(a).addTo(map);
m2=L.marker(b).addTo(map);
line=L.polyline([a,b],{color:"blue"}).addTo(map);

map.fitBounds(line.getBounds());

let miles=dist(a[0],a[1],b[0],b[1]);

let volume=
(+sofa.value*1.5)+(+bed.value*1.2)+(+wardrobe.value*2)+(+boxes.value*0.1);

let price=(volume*25)+(miles*1.2);

document.getElementById("result").innerText=
"Estimated: £"+price.toFixed(2)+" | "+miles.toFixed(1)+" miles";

window.lastPrice = price;
window.lastMiles = miles;
}

/* BOOKING + EMAILJS */
document.getElementById("form").addEventListener("submit",function(e){
e.preventDefault();

let ref = "ADM-"+Date.now();

let data={
ref:ref,
name:this.name.value,
phone:this.phone.value,
email:this.email.value,
date:this.date.value,
from:this.from.value,
to:this.to.value,
details:this.details.value,
price:window.lastPrice || 0,
miles:window.lastMiles || 0
};

/* save backup */
localStorage.setItem(ref,JSON.stringify(data));

/* send to owner */
emailjs.send("YOUR_SERVICE_ID","YOUR_TEMPLATE_ID",data);

/* send confirmation */
emailjs.send("YOUR_SERVICE_ID","YOUR_TEMPLATE_CONFIRM",data);

alert("Booking confirmed. Ref: "+ref);
this.reset();
});

</script>

</body>
</html>
