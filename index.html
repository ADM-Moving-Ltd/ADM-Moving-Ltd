<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ADM Moving LTD - Booking System</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
body{margin:0;font-family:Arial;background:#f5f7fb;}
.container{width:92%;max-width:1200px;margin:auto;}

.dashboard{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:30px;}

.card{background:white;padding:20px;border-radius:12px;box-shadow:0 10px 25px rgba(0,0,0,0.1);}

.section-title{font-weight:bold;margin:15px 0;}

.item-control{display:flex;justify-content:space-between;align-items:center;margin:8px 0;background:#f1f5f9;padding:10px;border-radius:8px;}

.item-buttons{display:flex;gap:10px;align-items:center;}

.btn-plus,.btn-minus{width:28px;height:28px;cursor:pointer;}

.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:10px;}

.calendar .day{padding:10px;text-align:center;background:#eee;cursor:pointer;border-radius:6px;}

.calendar .selected{background:#28c76f;color:white;}

input,select,textarea{
width:100%;
padding:10px;
margin:6px 0;
border-radius:8px;
border:1px solid #ccc;
}

.summary{
background:#eefaf2;
padding:10px;
border-radius:8px;
margin-top:10px;
font-size:14px;
}
</style>
</head>

<body>

<div class="container">

<div class="dashboard">

<!-- LEFT: CALCULATOR -->
<div class="card">

<h2>Moving Items</h2>

<div class="section-title">Living Room</div>

<div class="item-control">
<span>Sofa</span>
<div class="item-buttons">
<button class="btn-minus" data-name="Sofa" data-volume="3">-</button>
<span class="item-count">0</span>
<button class="btn-plus" data-name="Sofa" data-volume="3">+</button>
</div>
</div>

<div class="item-control">
<span>TV</span>
<div class="item-buttons">
<button class="btn-minus" data-name="TV" data-volume="1.5">-</button>
<span class="item-count">0</span>
<button class="btn-plus" data-name="TV" data-volume="1.5">+</button>
</div>
</div>

<div class="section-title">Bedroom</div>

<div class="item-control">
<span>Bed</span>
<div class="item-buttons">
<button class="btn-minus" data-name="Bed" data-volume="3.5">-</button>
<span class="item-count">0</span>
<button class="btn-plus" data-name="Bed" data-volume="3.5">+</button>
</div>
</div>

<div class="section-title">Kitchen</div>

<div class="item-control">
<span>Fridge</span>
<div class="item-buttons">
<button class="btn-minus" data-name="Fridge" data-volume="2.5">-</button>
<span class="item-count">0</span>
<button class="btn-plus" data-name="Fridge" data-volume="2.5">+</button>
</div>
</div>

<input id="distance" placeholder="Distance (miles)" oninput="calc()">

<select id="van" onchange="calc()">
<option value="1">Small Van</option>
<option value="1.3">Medium Van</option>
<option value="1.6">Large Van</option>
</select>

<div class="summary">
Volume: <span id="vol">0</span> m³ <br>
Total: £<span id="total">0</span>
</div>

</div>

<!-- RIGHT: BOOKING -->
<div class="card">

<h2>Customer Details</h2>

<input id="name" placeholder="Full Name">
<input id="phone" placeholder="Phone">
<input id="email" placeholder="Email">

<textarea id="pickup" placeholder="Pickup Address"></textarea>
<textarea id="dropoff" placeholder="Dropoff Address"></textarea>

<div class="section-title">Select Date</div>

<div id="calendar" class="calendar"></div>

<button onclick="book()" style="margin-top:10px;width:100%;padding:12px;background:#28c76f;color:white;border:none;border-radius:8px;">
Confirm Booking
</button>

<p id="msg" style="display:none;color:green;">Booking sent successfully</p>

</div>

</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

<script>
emailjs.init("rWnJNR9pMWg8bBMLM");

let vol=0;
let base=0;
let items={};
let selectedDate=null;

const PRICE_PER_MILE=1.5;

/* ITEMS */
document.addEventListener("click",(e)=>{
if(!e.target.dataset.name)return;

let name=e.target.dataset.name;
let v=parseFloat(e.target.dataset.volume);

if(!items[name])items[name]=0;

let parent=e.target.parentElement;
let count=parent.querySelector(".item-count");

if(e.target.classList.contains("btn-plus")){
items[name]++;vol+=v;base+=v*45;
}

if(e.target.classList.contains("btn-minus")&&items[name]>0){
items[name]--;vol-=v;base-=v*45;
}

count.textContent=items[name];
calc();
});

/* CALC */
function calc(){
let d=document.getElementById("distance").value||0;
let van=document.getElementById("van").value||1;

let total=(base+d*PRICE_PER_MILE)*van;

document.getElementById("vol").innerText=vol.toFixed(1);
document.getElementById("total").innerText=total.toFixed(0);
}

/* CALENDAR (ZI LUNĂ AN REAL) */
function renderCalendar(){
let cal=document.getElementById("calendar");
cal.innerHTML="";

let now=new Date();
let y=now.getFullYear();
let m=now.getMonth();

let days=new Date(y,m+1,0).getDate();
let today=new Date();today.setHours(0,0,0,0);

for(let i=1;i<=days;i++){
let d=document.createElement("div");
d.className="day";
d.textContent=i+" "+(m+1)+" "+y;

let date=new Date(y,m,i);

if(date<today){
d.style.opacity="0.3";
}else{
d.onclick=()=>{
selectedDate=date;
renderCalendar();
};
}

if(selectedDate&&selectedDate.getDate()==i)d.classList.add("selected");

cal.appendChild(d);
}
}

/* BOOK */
function book(){

let name=document.getElementById("name").value;
let phone=document.getElementById("phone").value;
let email=document.getElementById("email").value;
let pickup=document.getElementById("pickup").value;
let dropoff=document.getElementById("dropoff").value;

if(!name||!phone||!pickup||!dropoff||!selectedDate){
alert("Please complete all fields");
return;
}

let itemsList=Object.entries(items)
.filter(([k,v])=>v>0)
.map(([k,v])=>`${v}x ${k}`)
.join(", ");

let msg=
`NEW MOVING BOOKING
Name: ${name}
Phone: ${phone}
Email: ${email}

Pickup: ${pickup}
Dropoff: ${dropoff}

Date: ${selectedDate.toLocaleDateString("en-GB")}

Items: ${itemsList}

Volume: ${vol.toFixed(1)}m³
Total: £${document.getElementById("total").innerText}`;

/* WHATSAPP */
window.open("https://wa.me/447312814746?text="+encodeURIComponent(msg));

/* EMAIL */
emailjs.send("service_h4eoz48","template_01mylzs",{
name,phone,email,message:msg
});

document.getElementById("msg").style.display="block";
}

/* INIT */
window.onload=()=>{renderCalendar();calc();};
</script>

</body>
</html>
