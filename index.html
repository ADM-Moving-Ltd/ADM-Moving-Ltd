<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ADM Moving LTD</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
body{
margin:0;
font-family:Arial;
background:#eef3fb;
color:#1f2937;
}

header{
background:#0b1f3a;
color:white;
text-align:center;
padding:20px;
}

.hero{
background:url('https://images.unsplash.com/photo-1600518464441-9154a4dea21b') center/cover;
color:white;
padding:80px 20px;
text-align:center;
}

section{
padding:50px 10%;
}

.card{
background:white;
padding:20px;
border-radius:12px;
margin-top:15px;
}

input,select,textarea{
width:100%;
padding:10px;
margin-top:5px;
margin-bottom:15px;
}

button{
background:#22c55e;
color:white;
padding:15px;
border:none;
width:100%;
font-size:16px;
cursor:pointer;
border-radius:10px;
}

#map{
height:350px;
margin-top:20px;
border-radius:12px;
}
</style>
</head>

<body>

<header>
<h2>ADM MOVING LTD</h2>
<p>UK Removals • Packing • Furniture Assembly</p>
</header>

<div class="hero">
<h1>Fast & Reliable Moving Service</h1>
<p>Get instant quote based on real distance + inventory</p>
</div>

<section>

<h2>Book Your Move</h2>

<div class="card">

<input id="from" placeholder="Moving From Address">
<input id="to" placeholder="Moving To Address">

<input type="date" id="date">

<h3>Inventory (m³)</h3>

Sofa <input type="number" id="sofa" value="0">
Bed <input type="number" id="bed" value="0">
Wardrobe <input type="number" id="wardrobe" value="0">
Boxes <input type="number" id="boxes" value="0">

<button onclick="calculate()">Calculate Price</button>

<h3 id="result"></h3>

<div id="map"></div>

</div>

</section>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>

let map = L.map('map').setView([51.5, -0.12], 6);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
attribution:'OpenStreetMap'
}).addTo(map);

let marker1, marker2, line;

async function getCoords(address){
let res = await fetch("https://nominatim.openstreetmap.org/search?format=json&q=" + address);
let data = await res.json();
if(data.length === 0) return null;
return [parseFloat(data[0].lat), parseFloat(data[0].lon)];
}

function distance(lat1, lon1, lat2, lon2){
const R = 3959;
const dLat = (lat2-lat1)*Math.PI/180;
const dLon = (lon2-lon1)*Math.PI/180;

const a =
Math.sin(dLat/2)*Math.sin(dLat/2) +
Math.cos(lat1*Math.PI/180) *
Math.cos(lat2*Math.PI/180) *
Math.sin(dLon/2)*Math.sin(dLon/2);

const c = 2*Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
return R*c;
}

async function calculate(){

let from = document.getElementById("from").value;
let to = document.getElementById("to").value;

let a = await getCoords(from);
let b = await getCoords(to);

if(!a || !b){
alert("Address not found");
return;
}

if(marker1) map.removeLayer(marker1);
if(marker2) map.removeLayer(marker2);
if(line) map.removeLayer(line);

marker1 = L.marker(a).addTo(map);
marker2 = L.marker(b).addTo(map);

line = L.polyline([a,b],{color:'blue'}).addTo(map);

map.fitBounds(line.getBounds());

let miles = distance(a[0],a[1],b[0],b[1]);

let volume =
parseInt(sofa.value)*1.5 +
parseInt(bed.value)*1.2 +
parseInt(wardrobe.value)*2 +
parseInt(boxes.value)*0.1;

let price =
(volume * 25) + (miles * 1.25);

document.getElementById("result").innerHTML =
"Total: £" + price.toFixed(2) + " | Distance: " + miles.toFixed(1) + " miles";

}

</script>

</body>
</html>
