<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ADM Moving LTD - Booking System</title>

<style>
body{
font-family:Arial;
background:#f5f7fb;
margin:0;
}

header{
background:#0b1220;
color:white;
text-align:center;
padding:20px;
}

.container{
max-width:600px;
margin:auto;
padding:20px;
}

h1{
text-align:center;
}

input,select,textarea{
width:100%;
padding:12px;
margin:8px 0;
border-radius:8px;
border:1px solid #ccc;
font-size:14px;
}

button{
width:100%;
padding:14px;
background:#22c55e;
color:white;
border:none;
border-radius:10px;
font-weight:bold;
cursor:pointer;
}

button:hover{
background:#16a34a;
}

.success{
display:none;
background:#22c55e;
color:white;
padding:10px;
border-radius:8px;
text-align:center;
margin-bottom:10px;
}

.note{
text-align:center;
color:#555;
margin-bottom:10px;
}
</style>
</head>

<body>

<header>
<h2>🚚 ADM Moving LTD</h2>
<p>Fast UK Removals Booking System</p>
</header>

<div class="container">

<h1>Book Your Move</h1>

<p class="note">Select date and time. We confirm within 1 hour.</p>

<div class="success" id="success">Booking sent successfully</div>

<form id="form">

<input name="name" placeholder="Full Name" required>
<input name="phone" placeholder="Phone Number" required>
<input name="email" placeholder="Email" required>

<input type="date" name="date" required>

<select name="slot" required>
<option value="">Select Time Slot</option>
<option>Morning</option>
<option>Afternoon</option>
</select>

<input name="from" placeholder="Moving From" required>
<input name="to" placeholder="Moving To" required>

<textarea name="details" placeholder="Details" required></textarea>

<button type="submit">Request Booking</button>

</form>

</div>

<script>

const API_URL = "PASTE_YOUR_GOOGLE_SCRIPT_URL_HERE";

document.getElementById("form").addEventListener("submit", async function(e){
e.preventDefault();

const f = e.target;

const data = {
name: f.name.value,
phone: f.phone.value,
email: f.email.value,
date: f.date.value,
slot: f.slot.value,
from: f.from.value,
to: f.to.value,
details: f.details.value
};

const res = await fetch(API_URL, {
method: "POST",
body: JSON.stringify(data)
});

const result = await res.json();

if(result.status === "error"){
alert("This slot is already booked. Choose another time.");
return;
}

document.getElementById("success").style.display = "block";
f.reset();

});

</script>

</body>
</html>
