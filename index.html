<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ADM Moving LTD - Full System</title>

<style>
body{font-family:Arial;background:#f5f7fb;margin:0;}

header{
background:#1a365d;
color:white;
text-align:center;
padding:20px;
}

.hero{
background:
linear-gradient(rgba(0,0,0,0.6),rgba(0,0,0,0.6)),
url('https://images.unsplash.com/photo-1600518464441-9154a4dea21b');
background-size:cover;
background-position:center;
height:60vh;
display:flex;
align-items:center;
justify-content:center;
color:white;
text-align:center;
}

section{padding:60px 10%;}

.calendar{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(120px,1fr));
gap:10px;
margin-bottom:20px;
}

.day{
padding:12px;
background:white;
border-radius:8px;
text-align:center;
cursor:pointer;
}

.blocked{
background:#ef4444;
color:white;
pointer-events:none;
}

.selected{
background:#22c55e;
color:white;
}

.form-box{
max-width:600px;
margin:auto;
background:white;
padding:20px;
border-radius:10px;
}

input,select,textarea{
width:100%;
padding:10px;
margin:6px 0;
}

button{
width:100%;
padding:12px;
background:#22c55e;
color:white;
border:none;
border-radius:8px;
cursor:pointer;
}

.reviews{
display:grid;
gap:10px;
grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
}

.review{
background:white;
padding:15px;
border-radius:10px;
}

</style>
</head>

<body>

<header>
<h1>ADM Moving LTD</h1>
<p>Fully Automated Booking System</p>
</header>

<div class="hero">
<h1>Book Your Move Instantly</h1>
</div>

<section>

<h2>Select Date</h2>
<div class="calendar" id="calendar"></div>

<h2>Booking Form</h2>

<div class="form-box">

<form id="form">

<input name="name" placeholder="Name" required>
<input name="phone" placeholder="Phone" required>

<input type="date" name="date" id="date" required>

<select name="slot">
<option>Morning</option>
<option>Afternoon</option>
</select>

<input name="from" placeholder="From" required>
<input name="to" placeholder="To" required>

<textarea name="details" placeholder="Details"></textarea>

<button type="submit">Book Now</button>

</form>

</div>

</section>

<!-- REVIEWS -->
<section>
<h2>Customer Reviews</h2>

<div class="reviews">

<div class="review">
<strong>John M.</strong>
<p>“Very professional service. Quick and reliable.”</p>
</div>

<div class="review">
<strong>Sarah L.</strong>
<p>“Booking was easy and the team was very helpful.”</p>
</div>

<div class="review">
<strong>David K.</strong>
<p>“Best moving company I used in the UK.”</p>
</div>

</div>

</section>

<script>

const API = "PASTE_YOUR_GOOGLE_SCRIPT_URL";
const WHATSAPP = "447312814746";
const STRIPE = "PASTE_STRIPE_LINK";

let booked = [];

async function load(){
const res = await fetch(API);
const data = await res.json();
booked = data.booked || [];
renderCalendar();
}

function renderCalendar(){

const cal = document.getElementById("calendar");
cal.innerHTML = "";

for(let i=0;i<14;i++){

let d = new Date();
d.setDate(d.getDate()+i);

let dateStr = d.toISOString().split("T")[0];

let div = document.createElement("div");
div.className = "day";
div.innerText = dateStr;

let isBooked = booked.find(b => b.date === dateStr);

if(isBooked){
div.classList.add("blocked");
}

div.onclick = () => {
document.getElementById("date").value = dateStr;
};

cal.appendChild(div);
}
}

document.getElementById("form").addEventListener("submit", async function(e){
e.preventDefault();

const f = e.target;

const data = {
name:f.name.value,
phone:f.phone.value,
date:f.date.value,
slot:f.slot.value,
from:f.from.value,
to:f.to.value,
details:f.details.value
};

const res = await fetch(API,{
method:"POST",
body:JSON.stringify(data)
});

const result = await res.json();

if(result.status==="error"){
alert("Already booked");
return;
}

// WhatsApp message
let msg = `New Booking:
${data.name}
${data.phone}
${data.date}
${data.slot}`;

window.open(`https://wa.me/${WHATSAPP}?text=${encodeURIComponent(msg)}`);

// Payment redirect
window.open(STRIPE,"_blank");

alert("Booking received");

f.reset();

});

load();

</script>

</body>
</html>
