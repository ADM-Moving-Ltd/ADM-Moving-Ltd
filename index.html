<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ADM Moving LTD | Booking System V4</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Poppins,sans-serif;}

body{
background:linear-gradient(135deg,#0b1220,#111c33,#0f172a);
color:white;
}

/* HEADER + LOGO */
header{
text-align:center;
padding:40px 20px;
background:rgba(255,255,255,0.04);
backdrop-filter:blur(10px);
animation:fadeDown 1s ease;
}

.logo{
font-size:34px;
font-weight:700;
letter-spacing:2px;
}

.logo span{color:#22c55e;}

header p{opacity:0.8;margin-top:10px}

/* ANIMATION */
@keyframes fadeDown{
from{transform:translateY(-20px);opacity:0;}
to{transform:translateY(0);opacity:1;}
}

/* LAYOUT */
.container{max-width:1200px;margin:auto;padding:20px;}

.card{
background:rgba(255,255,255,0.05);
backdrop-filter:blur(12px);
padding:20px;
border-radius:16px;
margin-top:20px;
transition:0.3s;
}

.card:hover{transform:translateY(-3px);}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:15px;
}

.section-title{margin-bottom:15px;font-size:20px;color:#22c55e;}

/* INPUTS */
input,select,textarea{
width:100%;
padding:10px;
margin-top:6px;
border-radius:8px;
border:none;
outline:none;
background:#0b1220;
color:white;
}

textarea{min-height:70px;resize:vertical}

/* BUTTONS */
button{
padding:14px;
border:none;
border-radius:10px;
cursor:pointer;
font-weight:700;
margin-top:10px;
}

.btn{background:#22c55e;color:white;}
.btn:hover{background:#16a34a;}

/* INVENTORY */
.inventory{
display:grid;
grid-template-columns:1fr 1fr;
gap:15px;
}

.room{
padding:15px;
background:rgba(255,255,255,0.04);
border-radius:12px;
}

/* FLOATING BUTTONS */
.float{
position:fixed;
right:20px;
width:55px;
height:55px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
font-size:22px;
color:white;
text-decoration:none;
box-shadow:0 5px 20px rgba(0,0,0,0.3);
}

.whatsapp{bottom:20px;background:#25d366;}
.email{bottom:90px;background:#3b82f6;}

/* RESULT */
.result{
margin-top:15px;
font-size:18px;
}

.price{
font-size:28px;
font-weight:700;
color:#22c55e;
}

/* FEEDBACK */
.review-box textarea{
min-height:120px;
}

.small{font-size:12px;opacity:0.7}

</style>
</head>

<body>

<header>
<div class="logo">🚚 ADM <span>MOVING LTD</span></div>
<p>Professional Removals • Packing • Assembly • UK Nationwide</p>
</header>

<div class="container">

<!-- MOVE DETAILS -->
<div class="card">
<h2 class="section-title">Move Details</h2>

<div class="grid">
<input id="from" placeholder="Moving From Address">
<input id="to" placeholder="Moving To Address">
<input type="date" id="date">
</div>
</div>

<!-- INVENTORY -->
<div class="card">
<h2 class="section-title">Inventory (All Rooms)</h2>

<div class="inventory">

<div class="room">
<h3>Kitchen</h3>
<input id="k_fridge" placeholder="Fridge Freezer">
<input id="k_washer" placeholder="Washing Machine">
<input id="k_table" placeholder="Kitchen Table">
<input id="k_chairs" placeholder="Kitchen Chairs">
<textarea id="k_extra" placeholder="Extra kitchen items"></textarea>
</div>

<div class="room">
<h3>Living Room</h3>
<input id="l_sofa" placeholder="Sofa / Corner Sofa">
<input id="l_tv" placeholder="TV / Stand">
<input id="l_table" placeholder="Coffee Table">
<input id="l_cabinet" placeholder="Cabinets / Units">
<textarea id="l_extra" placeholder="Extra living room items"></textarea>
</div>

<div class="room">
<h3>Bedroom</h3>
<input id="b_bed" placeholder="Beds">
<input id="b_wardrobe" placeholder="Wardrobes">
<input id="b_dresser" placeholder="Dressers">
<input id="b_boxes" placeholder="Boxes">
<textarea id="b_extra" placeholder="Extra bedroom items"></textarea>
</div>

<div class="room">
<h3>Bathroom</h3>
<input id="bath_boxes" placeholder="Bathroom Boxes">
<input id="bath_cabinet" placeholder="Cabinets">
<textarea id="bath_extra" placeholder="Extra bathroom items"></textarea>
</div>

<div class="room">
<h3>Garden</h3>
<input id="g_table" placeholder="Garden Table">
<input id="g_chairs" placeholder="Garden Chairs">
<input id="g_tools" placeholder="Tools / Equipment">
<textarea id="g_extra" placeholder="Extra garden items"></textarea>
</div>

</div>
</div>

<!-- BOXES + SERVICES -->
<div class="card">
<h2 class="section-title">Boxes & Services</h2>

<div class="grid">
<input id="small" placeholder="Small Boxes">
<input id="medium" placeholder="Medium Boxes">
<input id="large" placeholder="Large Boxes">
<input id="wardrobe_boxes" placeholder="Wardrobe Boxes">

<select id="service">
<option value="0">No Service</option>
<option value="50">Dismantling (+£50)</option>
<option value="100">Dismantling + Assembly (+£100)</option>
</select>
</div>
</div>

<!-- PRICE -->
<div class="card">
<h2 class="section-title">Price Calculator</h2>

<button class="btn" onclick="calculate()">Calculate Price</button>

<div class="result" id="result"></div>
<div class="price" id="price"></div>

</div>

<!-- FEEDBACK -->
<div class="card review-box">
<h2 class="section-title">Customer Feedback</h2>

<input id="name" placeholder="Your Name">

<select id="rating">
<option>⭐ 5</option>
<option>⭐ 4</option>
<option>⭐ 3</option>
<option>⭐ 2</option>
<option>⭐ 1</option>
</select>

<textarea id="feedback" placeholder="Write your experience with ADM Moving LTD"></textarea>

<button class="btn" onclick="submitFeedback()">Submit Feedback</button>

<p class="small" id="thanks"></p>
</div>

</div>

<!-- FLOATING BUTTONS -->
<a class="float whatsapp" href="https://wa.me/447312814746" target="_blank">💬</a>
<a class="float email" href="mailto:admmoving@yahoo.com">✉️</a>

<script>

let volume = 0;
let price = 0;

function val(id){
return parseFloat(document.getElementById(id)?.value || 0);
}

function calculate(){

volume =
val("l_sofa")*1.5 +
val("l_tv")*0.3 +
val("l_table")*1 +
val("b_bed")*1.2 +
val("b_wardrobe")*2 +
val("k_fridge")*1.5 +
val("k_washer")*1.2 +
val("small")*0.1 +
val("medium")*0.15 +
val("large")*0.25 +
val("wardrobe_boxes")*1.8;

let distance = Math.floor(Math.random()*120)+10;

price = (volume*25) + (distance*1.2) + parseInt(document.getElementById("service").value);

document.getElementById("result").innerHTML =
"Volume: " + volume.toFixed(2) + " m³ | Distance: " + distance + " km";

document.getElementById("price").innerHTML =
"Total Price: £" + price.toFixed(2);
}

function submitFeedback(){
document.getElementById("thanks").innerHTML =
"Thank you for your feedback. It has been recorded.";
}

</script>

</body>
</html>
