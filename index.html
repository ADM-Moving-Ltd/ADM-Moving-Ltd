<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ADM Moving LTD | Smart Booking System</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
body{
    margin:0;
    font-family:Arial;
    background:#f5f7fb;
}

.container{
    width:92%;
    max-width:1200px;
    margin:auto;
}

.dashboard{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
    margin-top:40px;
}

.card{
    background:#fff;
    padding:20px;
    border-radius:12px;
    box-shadow:0 10px 25px rgba(0,0,0,0.1);
}

.item-control{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin:10px 0;
    padding:10px;
    background:#f1f5f9;
    border-radius:8px;
}

.item-buttons{
    display:flex;
    align-items:center;
    gap:10px;
}

.btn-plus,.btn-minus{
    width:30px;
    height:30px;
    cursor:pointer;
}

.calendar{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    gap:5px;
    margin-top:10px;
}

.calendar .day{
    padding:10px;
    text-align:center;
    background:#eee;
    cursor:pointer;
    border-radius:6px;
}

.calendar .selected{
    background:#28c76f;
    color:white;
}
</style>
</head>

<body>

<div class="container">

<div class="dashboard">

<!-- LEFT -->
<div class="card">
<h3>Moving Calculator</h3>

<div class="item-control">
<span>Sofa</span>
<div class="item-buttons">
<button class="btn-minus" data-name="Sofa" data-volume="3">-</button>
<span class="item-count">0</span>
<button class="btn-plus" data-name="Sofa" data-volume="3">+</button>
</div>
</div>

<div class="item-control">
<span>TV</span>
<div class="item-buttons">
<button class="btn-minus" data-name="TV" data-volume="1.5">-</button>
<span class="item-count">0</span>
<button class="btn-plus" data-name="TV" data-volume="1.5">+</button>
</div>
</div>

<div class="item-control">
<span>Fridge</span>
<div class="item-buttons">
<button class="btn-minus" data-name="Fridge" data-volume="2">-</button>
<span class="item-count">0</span>
<button class="btn-plus" data-name="Fridge" data-volume="2">+</button>
</div>
</div>

<input id="distance" type="number" placeholder="Distance (miles)" oninput="calc()">

<select id="van" onchange="calc()">
<option value="1">Small Van</option>
<option value="1.3">Medium Van</option>
<option value="1.6">Large Van</option>
</select>

<h3>Volume: <span id="vol">0</span> m³</h3>
<h3>Total: £<span id="total">0</span></h3>

</div>

<!-- RIGHT -->
<div class="card">
<h3>Book Move</h3>

<input id="name" placeholder="Name">
<input id="phone" placeholder="Phone">
<input id="email" placeholder="Email">

<div class="calendar" id="calendar"></div>

<button onclick="book()" style="margin-top:10px;">Confirm Booking</button>

<p id="msg" style="display:none;color:green;">Booking sent</p>

</div>

</div>
</div>

<!-- EMAILJS -->
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

<script>
emailjs.init("rWnJNR9pMWg8bBMLM");

/* STATE */
let vol = 0;
let base = 0;
let items = {};
let selectedDate = null;

const PRICE_PER_MILE = 1.5;

/* ITEM CONTROL */
document.addEventListener("click",(e)=>{

    if(!e.target.dataset.name) return;

    const name = e.target.dataset.name;
    const volume = parseFloat(e.target.dataset.volume);

    if(!items[name]) items[name]=0;

    const parent = e.target.parentElement;
    const countEl = parent.querySelector(".item-count");

    if(e.target.classList.contains("btn-plus")){
        items[name]++;
        vol += volume;
        base += volume * 45;
    }

    if(e.target.classList.contains("btn-minus") && items[name]>0){
        items[name]--;
        vol -= volume;
        base -= volume * 45;
    }

    countEl.textContent = items[name];
    calc();
});

/* CALC */
function calc(){

    let distance = parseFloat(document.getElementById("distance").value)||0;
    let van = parseFloat(document.getElementById("van").value)||1;

    let total = (base + distance*PRICE_PER_MILE) * van;

    document.getElementById("vol").innerText = vol.toFixed(1);
    document.getElementById("total").innerText = total.toFixed(0);
}

/* CALENDAR FULL */
function renderCalendar(){

    const cal = document.getElementById("calendar");
    cal.innerHTML="";

    const now = new Date();
    const year = now.getFullYear();
    const month = now.getMonth();

    const days = new Date(year,month+1,0).getDate();
    const today = new Date();
    today.setHours(0,0,0,0);

    for(let i=1;i<=days;i++){

        const day = document.createElement("div");
        day.className="day";
        day.textContent=i;

        const date = new Date(year,month,i);

        if(date < today){
            day.style.opacity="0.3";
        } else {
            day.onclick=()=>{
                selectedDate=date;
                renderCalendar();
            }
        }

        if(selectedDate && selectedDate.getDate()==i){
            day.classList.add("selected");
        }

        cal.appendChild(day);
    }
}

/* BOOKING + WHATSAPP + EMAIL */
function book(){

    const name = document.getElementById("name").value.trim();
    const phone = document.getElementById("phone").value.trim();
    const email = document.getElementById("email").value.trim();

    if(!name || !phone || !selectedDate){
        alert("Complete all fields + select date");
        return;
    }

    let itemsList = Object.entries(items)
    .filter(([k,v])=>v>0)
    .map(([k,v])=>`${v}x ${k}`)
    .join(", ");

    let dateStr = selectedDate.toLocaleDateString("en-GB");

    let message =
`New Move Request:
Name: ${name}
Phone: ${phone}
Date: ${dateStr}

Items: ${itemsList}

Volume: ${vol.toFixed(1)}m³
Total: £${document.getElementById("total").innerText}`;

    /* WHATSAPP */
    window.open("https://wa.me/447312814746?text=" + encodeURIComponent(message));

    /* EMAIL */
    emailjs.send("service_h4eoz48","template_01mylzs",{
        name,
        phone,
        email,
        date: dateStr,
        message
    });

    document.getElementById("msg").style.display="block";
}

/* INIT */
window.onload=function(){
    renderCalendar();
    calc();
};
</script>

</body>
</html>
