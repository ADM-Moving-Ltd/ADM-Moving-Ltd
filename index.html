<!DOCTYPE html>
<html lang="en">
<head>

<style>

body{

}

}

background:#122b4d;

padding:12px;

top:0;

}

nav a{
color:white;
margin:0 15px;
text-decoration:none;
font-weight:bold;
}

.hero{
height:80vh;
background:
linear-gradient(rgba(0,0,0,0.55),rgba(0,0,0,0.55)),
url('https://images.unsplash.com/photo-1600518464441-9154a4dea21b?auto=format&fit=crop&w=1600&q=80');
background-size:cover;
background-position:center;

align-items:center;
justify-content:center;
text-align:center;
color:white;
padding:20px;
}

.btn{
background:#22c55e;
color:white;
padding:14px 24px;
border-radius:10px;

}

section{

}

.form-box{
max-width:700px;
margin:auto;
background:white;
padding:30px;
border-radius:14px;
box-shadow:0 10px 25px rgba(0,0,0,0.08);
}

input,select,textarea{
width:100%;
padding:12px;
margin:8px 0;
border-radius:8px;
border:1px solid #ccc;
font-size:15px;
}

button{
width:100%;
padding:14px;
background:#22c55e;
color:white;
border:none;
border-radius:10px;
font-size:16px;
font-weight:bold;
cursor:pointer;
}

button:hover{
background:#16a34a;
}

footer{
background:#0b1f3a;
color:white;
text-align:center;
padding:20px;
margin-top:40px;
}

.whatsapp-float{
position:fixed;
bottom:20px;
right:20px;
width:60px;
height:60px;
background:#25d366;
color:white;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
font-size:28px;
text-decoration:none;
z-index:999;
}

.email-float{
position:fixed;
bottom:90px;
right:20px;
width:60px;
height:60px;
background:#2563eb;
color:white;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
font-size:24px;
text-decoration:none;
z-index:999;
}

</style>
</head>

<body>

<header>
<h1>🚚 ADM Moving LTD</h1>
<p>Professional House Removals Across the UK</p>
</header>

<nav>
<a href="#booking">Book</a>
<a href="#contact">Contact</a>
</nav>

<div class="hero">
<div>
<h1>Stress-Free Moving Service</h1>
<p>Reliable UK removals with instant booking system.</p>
<a class="btn" href="#booking">Book Your Move</a>
</div>
</div>

<!-- BOOKING -->
<section id="booking">

<h2 style="text-align:center;">Book Your Move</h2>

<div class="form-box">

<form id="form">

<input name="name" placeholder="Full Name" required>
<input name="phone" placeholder="Phone Number" required>
<input name="email" placeholder="Email Address" required>

<input type="date" name="date" required>

<select name="slot" required>
<option value="">Select Time Slot</option>
<option>Morning</option>
<option>Afternoon</option>
</select>

<input name="from" placeholder="Moving From" required>
<input name="to" placeholder="Moving To" required>

<textarea name="details" placeholder="Extra Details" required></textarea>

<button type="submit">Request Booking</button>

</form>

</div>

</section>

<!-- CONTACT -->
<section id="contact">
<h2 style="text-align:center;">Contact</h2>
<p style="text-align:center;">admmoving@yahoo.com</p>
</section>

<footer>
© 2026 ADM Moving LTD
</footer>

<a class="whatsapp-float" href="https://wa.me/447312814746">💬</a>
<a class="email-float" href="mailto:admmoving@yahoo.com">✉️</a>

<script>

/* EMAILJS FULL SYSTEM (UPGRADED) */

document.getElementById('form').addEventListener('submit', function(e) {
  e.preventDefault();

  const form = this;

  // 1. Send booking to you
  emailjs.sendForm(
    "YOUR_SERVICE_ID",
    "YOUR_TEMPLATE_ID",
    form
  )
  .then(function() {

    // 2. Send confirmation to customer
    emailjs.send("YOUR_SERVICE_ID", "YOUR_TEMPLATE_ID_CONFIRM", {
      name: form.name.value,
      email: form.email.value,
      phone: form.phone.value,
      date: form.date.value,
      slot: form.slot.value,
      from: form.from.value,
      to: form.to.value,
      details: form.details.value
    });

    alert("Booking sent successfully. Confirmation email sent.");
    form.reset();

  }, function(error) {
    alert("Error sending booking.");
    console.log(error);
  });

});

</script>

</body>
</html>
