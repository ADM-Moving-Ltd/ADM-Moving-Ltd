<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ADM Moving LTD | Business System V3</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
body{
margin:0;
font-family:Poppins,sans-serif;
background:#eef3fb;
color:#1f2937;
}

header{
background:#081c3a;
color:white;
text-align:center;
padding:20px;
}

nav{
background:#10284d;
padding:12px;
text-align:center;
position:sticky;
top:0;
}

nav a{
color:white;
margin:0 12px;
text-decoration:none;
font-weight:600;
}

section{
padding:60px 10%;
}

.hero{
background:url('https://images.unsplash.com/photo-1600518464441-9154a4dea21b') center/cover;
height:80vh;
display:flex;
align-items:center;
justify-content:center;
color:white;
text-align:center;
position:relative;
}

.hero::before{
content:'';
position:absolute;
top:0;left:0;right:0;bottom:0;
background:rgba(0,0,0,0.5);
}

.hero div{
position:relative;
}

.btn{
background:#22c55e;
padding:14px 25px;
border:none;
color:white;
font-weight:700;
border-radius:10px;
cursor:pointer;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:15px;
}

.card{
background:white;
padding:20px;
border-radius:12px;
box-shadow:0 8px 20px rgba(0,0,0,0.08);
}

input,select,textarea{
width:100%;
padding:12px;
margin:6px 0;
border-radius:8px;
border:1px solid #ccc;
}

table{
width:100%;
background:white;
border-collapse:collapse;
margin-top:20px;
}

th,td{
padding:10px;
border-bottom:1px solid #eee;
}

.result{
font-size:22px;
font-weight:700;
margin-top:15px;
}

.floating{
position:fixed;
right:20px;
width:55px;
height:55px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
color:white;
font-size:22px;
text-decoration:none;
box-shadow:0 5px 15px rgba(0,0,0,0.2);
}

.whatsapp{bottom:20px;background:#25d366;}
.email{bottom:85px;background:#2563eb;}

.admin{
background:#fff;
padding:20px;
margin-top:20px;
border-radius:10px;
}

</style>
</head>

<body>

<header>
<h1>ADM Moving LTD</h1>
<p>Business System V3 - Smart Quotes + Distance Pricing</p>
</header>

<nav>
<a href="#booking">Booking</a>
<a href="#admin">Admin</a>
</nav>

<section class="hero">
<div>
<h1>Instant Moving Quote System</h1>
<button class="btn" onclick="document.getElementById('booking').scrollIntoView()">Start Booking</button>
</div>
</section>

<section id="booking">

<h2>Booking System</h2>

<input id="from" placeholder="Moving From Address">
<input id="to" placeholder="Moving To Address">
<input type="date" id="date">

<h3>Inventory</h3>

<table>
<tr><th>Item</th><th>Qty</th><th>m³</th></tr>

<tr><td>Sofa</td><td><input id="sofa" type="number" value="0"></td><td>1.5</td></tr>
<tr><td>Wardrobe</td><td><input id="wardrobe" type="number" value="0"></td><td>2.0</td></tr>
<tr><td>Bed</td><td><input id="bed" type="number" value="0"></td><td>1.2</td></tr>
<tr><td>Small Boxes</td><td><input id="small" type="number" value="0"></td><td>0.1</td></tr>
<tr><td>Medium Boxes</td><td><input id="medium" type="number" value="0"></td><td>0.15</td></tr>
<tr><td>Large Boxes</td><td><input id="large" type="number" value="0"></td><td>0.25</td></tr>

</table>

<button class="btn" onclick="calculate()">Calculate Price</button>

<div class="result" id="result"></div>

<input id="name" placeholder="Full Name">
<input id="phone" placeholder="Phone">
<input id="email" placeholder="Email">

<button class="btn" onclick="saveBooking()">Confirm Booking</button>

</section>

<section id="admin">

<h2>Admin Dashboard</h2>
<div class="admin" id="adminList"></div>

</section>

<a class="floating whatsapp" href="https://wa.me/447312814746" target="_blank">💬</a>
<a class="floating email" href="mailto:admmoving@yahoo.com">✉️</a>

<script>

/* DISTANCE CALC */
async function getCoords(addr){
let r = await fetch("https://nominatim.openstreetmap.org/search?format=json&q="+addr);
let d = await r.json();
if(!d[0]) return null;
return [parseFloat(d[0].lat), parseFloat(d[0].lon)];
}

function km(lat1,lon1,lat2,lon2){
const R=6371;
let dLat=(lat2-lat1)*Math.PI/180;
let dLon=(lon2-lon1)*Math.PI/180;
let a=Math.sin(dLat/2)**2+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

let lastQuote={};

async function calculate(){

let a = await getCoords(from.value);
let b = await getCoords(to.value);

if(!a||!b){alert("Address not found");return;}

let distance = km(a[0],a[1],b[0],b[1]);

let volume =
(sofa.value*1.5)+
(wardrobe.value*2)+
(bed.value*1.2)+
(small.value*0.1)+
(medium.value*0.15)+
(large.value*0.25);

let price = (volume*25) + (distance*1.5);

result.innerHTML =
"Distance: "+distance.toFixed(1)+" km | Volume: "+volume.toFixed(2)+" m³ | Price: £"+price.toFixed(2);

lastQuote={distance,volume,price};
}

/* SAVE BOOKING */
function saveBooking(){

let bookings = JSON.parse(localStorage.getItem("bookings")||"[]");

bookings.push({
name:name.value,
phone:phone.value,
email:email.value,
from:from.value,
to:to.value,
price:lastQuote.price,
volume:lastQuote.volume,
distance:lastQuote.distance
});

localStorage.setItem("bookings",JSON.stringify(bookings));

alert("Booking saved (Admin Panel)");

loadAdmin();
}

/* ADMIN */
function loadAdmin(){

let list = JSON.parse(localStorage.getItem("bookings")||"[]");

adminList.innerHTML = list.map(b=>
`<div class="card">
<b>${b.name}</b><br>
${b.from} → ${b.to}<br>
Distance: ${b.distance.toFixed(1)} km<br>
Volume: ${b.volume.toFixed(2)} m³<br>
Price: £${b.price.toFixed(2)}
</div>`
).join("");

}

loadAdmin();

</script>

</body>
</html>
