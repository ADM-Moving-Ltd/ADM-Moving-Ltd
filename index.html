<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ADM Moving LTD | Smart Booking System</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
background:#eef2f6;
color:#222;
}

/* NAV */
.navbar{
background:#28c76f;
padding:14px 0;
}

.navbar .container{
width:90%;
max-width:1100px;
margin:auto;
display:flex;
justify-content:space-between;
align-items:center;
}

.navbar a{
color:white;
text-decoration:none;
margin:0 10px;
font-weight:600;
}

/* HERO */
.hero{
background:linear-gradient(rgba(0,0,0,0.65),rgba(0,0,0,0.65)),
url("https://images.pexels.com/photos/7464707/pexels-photo-7464707.jpeg");
background-size:cover;
background-position:center;
height:70vh;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
color:white;
padding:20px;
}

.hero h1{font-size:48px;}
.hero p{margin-top:10px;font-size:18px;}

/* LAYOUT */
.container{
width:90%;
max-width:1100px;
margin:auto;
}

.section{
padding:60px 0;
}

.title{
text-align:center;
font-size:30px;
margin-bottom:30px;
}

/* DASHBOARD */
.dashboard{
display:grid;
grid-template-columns:1fr 1fr;
gap:20px;
}

/* CARD */
.card{
background:white;
padding:20px;
border-radius:12px;
box-shadow:0 10px 25px rgba(0,0,0,0.08);
}

/* CALC BUTTONS */
button{
background:#28c76f;
color:white;
border:none;
padding:10px 12px;
margin:5px;
border-radius:8px;
cursor:pointer;
font-weight:600;
}

/* INPUTS */
input,select{
width:100%;
padding:10px;
margin-top:10px;
border-radius:8px;
border:1px solid #ddd;
}

/* CALENDAR */
.calendar{
display:grid;
grid-template-columns:repeat(7,1fr);
gap:6px;
margin-top:10px;
}

.day{
background:#f0f0f0;
padding:8px;
font-size:12px;
text-align:center;
border-radius:6px;
cursor:pointer;
}

.day.selected{
background:#28c76f;
color:white;
}

/* RESULT */
.result{
margin-top:10px;
font-weight:600;
}

/* WHATSAPP */
.whatsapp{
position:fixed;
right:18px;
bottom:18px;
width:55px;
height:55px;
background:#25D366;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
color:white;
font-size:24px;
}

/* MOBILE */
@media(max-width:900px){
.dashboard{
grid-template-columns:1fr;
}
.hero h1{font-size:32px;}
}

</style>
</head>

<body>

<div class="navbar">
<div class="container">
<div style="color:white;font-weight:bold;">ADM Moving LTD</div>
<div>
<a href="#dash">System</a>
<a href="#contact">Contact</a>
</div>
</div>
</div>

<section class="hero">
<div>
<h1>Smart Booking System</h1>
<p>Quotes + Calendar + Instant WhatsApp</p>
</div>
</section>

<section id="dash" class="section">
<div class="container">

<h2 class="title">Booking Dashboard</h2>

<div class="dashboard">

<!-- LEFT: CALCULATOR -->
<div class="card">

<h3>Calculator</h3>

<button onclick="add(3)">Sofa</button>
<button onclick="add(3)">Bed</button>
<button onclick="add(1)">Chair</button>
<button onclick="add(2.5)">Wardrobe</button>
<button onclick="add(0.2)">Box</button>

<p style="margin-top:10px;">Volume: <b><span id="vol">0</span> m³</b></p>

<input type="number" id="distance" placeholder="Distance (miles)">

<select id="van" onchange="calc()">
<option value="1">Small Van</option>
<option value="1.3">Medium Van</option>
<option value="1.6">Large Van</option>
</select>

<div class="result">
Base: £<span id="base">0</span><br>
Distance: £<span id="dist">0</span><br>
TOTAL: £<span id="total">0</span>
</div>

</div>

<!-- RIGHT: BOOKING -->
<div class="card">

<h3>Booking Calendar</h3>

<input type="text" id="name" placeholder="Name">
<input type="text" id="phone" placeholder="Phone">

<div class="calendar" id="calendar"></div>

<select id="time">
<option>08-10</option>
<option>10-12</option>
<option>12-14</option>
<option>14-16</option>
<option>16-18</option>
</select>

<button onclick="book()">Confirm Booking</button>

<p id="msg" style="display:none;color:green;font-weight:bold;margin-top:10px;">
Booked successfully
</p>

</div>

</div>

</div>
</section>

<section id="contact" class="section">
<div class="container">
<div class="card">
<p>Phone: 07312 814746</p>
<p>Email: admmoving@yahoo.com</p>
</div>
</div>
</section>

<a class="whatsapp" id="wa" target="_blank">
<i class="fab fa-whatsapp"></i>
</a>

<script>

/* CALC */
let vol=0,base=0;

function add(v){
vol+=v;
base+=v*45;
calc();
}

function calc(){

let d=document.getElementById("distance").value||0;
let v=document.getElementById("van").value;

let dist=d*2.2;
let total=(base+dist)*v;

document.getElementById("vol").innerText=vol.toFixed(1);
document.getElementById("base").innerText=base.toFixed(0);
document.getElementById("dist").innerText=dist.toFixed(0);
document.getElementById("total").innerText=total.toFixed(0);

document.getElementById("wa").href=
"https://wa.me/447312814746?text="+
encodeURIComponent(`Quote: ${vol.toFixed(1)}m³ total £${total.toFixed(0)}`);
}

document.getElementById("distance").addEventListener("input",calc);

/* CALENDAR */
let booked=JSON.parse(localStorage.getItem("b")||"[]");
let sel=null;

function gen(){

let c=document.getElementById("calendar");
c.innerHTML="";

let t=new Date();

for(let i=0;i<14;i++){
let d=new Date();
d.setDate(t.getDate()+i);
let ds=d.toISOString().split("T")[0];

let el=document.createElement("div");
el.className="day";

if(booked.includes(ds)){
el.innerText="X";
el.style.opacity="0.4";
}else{
el.innerText=ds.slice(5);
el.onclick=()=>{sel=ds;document.querySelectorAll(".day").forEach(x=>x.classList.remove("selected"));el.classList.add("selected");};
}

c.appendChild(el);
}
}

gen();

/* BOOK */
function book(){

let n=document.getElementById("name").value;
let p=document.getElementById("phone").value;
let t=document.getElementById("time").value;

if(!n||!p||!sel)return alert("Fill all");

booked.push(sel);
localStorage.setItem("b",JSON.stringify(booked));

window.open(`https://wa.me/447312814746?text=${encodeURIComponent("Booking "+n+" "+sel+" "+t)}`);

fetch("https://formsubmit.co/admmoving@yahoo.com",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({name:n,phone:p,date:sel,time:t})
});

document.getElementById("msg").style.display="block";

gen();
}

</script>

</body>
</html>
