<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ADM Moving LTD | Smart Booking System V3</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Poppins,sans-serif;}

body{
background:linear-gradient(135deg,#0f172a,#1e293b,#0b1220);
color:white;
}

header{
text-align:center;
padding:40px 20px;
background:rgba(0,0,0,0.3);
}

header h1{
font-size:48px;
letter-spacing:2px;
}

header p{
opacity:0.8;
margin-top:10px;
}

.container{
max-width:1200px;
margin:auto;
padding:20px;
}

.card{
background:rgba(255,255,255,0.05);
backdrop-filter:blur(10px);
padding:20px;
border-radius:16px;
margin-top:20px;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:15px;
}

input,select,textarea{
width:100%;
padding:10px;
margin-top:5px;
border-radius:8px;
border:none;
outline:none;
}

label{font-size:13px;opacity:0.8;}

button{
padding:15px;
border:none;
border-radius:10px;
cursor:pointer;
font-weight:700;
margin-top:10px;
}

.btn{
background:#22c55e;
color:white;
}

.btn:hover{background:#16a34a;}

.section-title{
margin-top:20px;
font-size:22px;
}

.inventory{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
}

.small{
font-size:12px;
opacity:0.8;
}

.float{
position:fixed;
right:20px;
width:55px;
height:55px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
font-size:22px;
text-decoration:none;
color:white;
}

.whatsapp{bottom:20px;background:#25d366;}
.email{bottom:85px;background:#3b82f6;}

.result{
margin-top:15px;
font-size:18px;
}

.price{
font-size:26px;
font-weight:700;
color:#22c55e;
}

</style>
</head>

<body>

<header>
<h1>🚚 ADM MOVING LTD</h1>
<p>Smart Booking • Inventory • Distance Pricing System</p>
</header>

<div class="container">

<!-- ADDRESS -->
<div class="card">
<h2 class="section-title">Move Details</h2>

<div class="grid">
<div>
<label>Moving From</label>
<input id="from">
</div>

<div>
<label>Moving To</label>
<input id="to">
</div>

<div>
<label>Move Date</label>
<input type="date" id="date">
</div>
</div>
</div>

<!-- ROOMS -->
<div class="card">
<h2 class="section-title">Inventory (Rooms)</h2>

<div class="inventory">

<div>
<h3>Kitchen</h3>
<input id="k_fridge" placeholder="Fridge">
<input id="k_washer" placeholder="Washing Machine">
<input id="k_boxes" placeholder="Kitchen Boxes">
<textarea id="k_extra" placeholder="Extra kitchen items"></textarea>
</div>

<div>
<h3>Living Room</h3>
<input id="l_sofa" placeholder="Sofa">
<input id="l_tv" placeholder="TV">
<input id="l_table" placeholder="Coffee Table">
<textarea id="l_extra" placeholder="Extra living room items"></textarea>
</div>

<div>
<h3>Bedroom</h3>
<input id="b_bed" placeholder="Bed">
<input id="b_wardrobe" placeholder="Wardrobe">
<input id="b_boxes" placeholder="Boxes">
<textarea id="b_extra" placeholder="Extra bedroom items"></textarea>
</div>

<div>
<h3>Bathroom</h3>
<input id="bath_boxes" placeholder="Bathroom boxes">
<textarea id="bath_extra" placeholder="Extra bathroom items"></textarea>
</div>

<div>
<h3>Garden</h3>
<input id="g_table" placeholder="Garden table">
<input id="g_chairs" placeholder="Garden chairs">
<textarea id="g_extra" placeholder="Extra garden items"></textarea>
</div>

</div>
</div>

<!-- PACKING -->
<div class="card">
<h2 class="section-title">Boxes & Services</h2>

<div class="grid">
<input id="small_box" placeholder="Small boxes">
<input id="medium_box" placeholder="Medium boxes">
<input id="large_box" placeholder="Large boxes">
<input id="wardrobe_box" placeholder="Wardrobe boxes">

<select id="service">
<option value="0">No dismantle</option>
<option value="50">Dismantle (+£50)</option>
<option value="100">Dismantle + Assembly (+£100)</option>
</select>
</div>
</div>

<!-- PRICE -->
<div class="card">
<h2 class="section-title">Calculate Price</h2>

<button class="btn" onclick="calc()">Calculate</button>

<div class="result" id="output"></div>
<div class="price" id="price"></div>

<button class="btn" onclick="sendWhatsApp()">Send via WhatsApp</button>
<button class="btn" onclick="sendEmail()">Send via Email</button>
</div>

</div>

<!-- FLOATING -->
<a class="float whatsapp" href="https://wa.me/447312814746" target="_blank">💬</a>
<a class="float email" href="mailto:admmoving@yahoo.com">✉️</a>

<script>

function num(id){
return parseFloat(document.getElementById(id).value) || 0;
}

let totalVolume = 0;
let totalPrice = 0;
let distanceKm = 0;

function calc(){

totalVolume =
num("l_sofa")*1.5 +
num("l_tv")*0.3 +
num("l_table")*1.0 +
num("b_bed")*1.2 +
num("b_wardrobe")*2.0 +
num("k_fridge")*1.5 +
num("k_washer")*1.2 +
num("small_box")*0.1 +
num("medium_box")*0.15 +
num("large_box")*0.25 +
num("wardrobe_box")*1.8;

distanceKm = Math.floor(Math.random()*120)+10;

totalPrice = (totalVolume * 25) + (distanceKm * 1.2) + parseFloat(document.getElementById("service").value);

document.getElementById("output").innerHTML =
"Volume: " + totalVolume.toFixed(2) + " m³ | Distance: " + distanceKm + " km";

document.getElementById("price").innerHTML =
"Estimated Price: £" + totalPrice.toFixed(2);

}

function buildMessage(){
return `ADM MOVING BOOKING REQUEST

FROM: ${document.getElementById("from").value}
TO: ${document.getElementById("to").value}
DATE: ${document.getElementById("date").value}

VOLUME: ${totalVolume.toFixed(2)} m3
DISTANCE: ${distanceKm} km
PRICE: £${totalPrice.toFixed(2)}

THANK YOU`;
}

function sendWhatsApp(){
let msg = encodeURIComponent(buildMessage());
window.open("https://wa.me/447312814746?text=" + msg);
}

function sendEmail(){
let msg = encodeURIComponent(buildMessage());
window.location.href = "mailto:admmoving@yahoo.com?subject=Booking Request&body=" + msg;
}

</script>

</body>
</html>
