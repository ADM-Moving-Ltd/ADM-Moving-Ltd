<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ADM Moving LTD | Smart Booking System</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
}

:root {
    --primary: #28c76f;
    --primary-dark: #22a85d;
    --secondary: #1e293b;
    --light: #f8fafc;
    --gray: #64748b;
    --light-gray: #e2e8f0;
    --shadow: 0 10px 30px rgba(0,0,0,0.1);
    --shadow-lg: 0 20px 40px rgba(0,0,0,0.15);
    --transition: all 0.3s ease;
}

body {
    background: linear-gradient(135deg, #f0f4f8 0%, #e6edf5 100%);
    color: var(--secondary);
    line-height: 1.6;
}

.navbar {
    background: var(--primary);
    padding: 18px 0;
    position: sticky;
    top: 0;
    z-index: 1000;
    box-shadow: 0 2px 15px rgba(0,0,0,0.1);
}

.navbar .container {
    width: 92%;
    max-width: 1200px;
    margin: 0 auto;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo {
    color: white;
    font-size: 24px;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 10px;
}

.logo i {
    font-size: 28px;
}

.nav-links {
    display: flex;
    gap: 30px;
}

.nav-links a {
    color: white;
    text-decoration: none;
    font-weight: 500;
    font-size: 16px;
    transition: var(--transition);
    position: relative;
}

.nav-links a::after {
    content: '';
    position: absolute;
    bottom: -4px;
    left: 0;
    width: 0;
    height: 2px;
    background: white;
    transition: var(--transition);
}

.nav-links a:hover {
    color: #f0fdf4;
}

.nav-links a:hover::after {
    width: 100%;
}

.hero {
    background: linear-gradient(rgba(30, 41, 59, 0.75), rgba(30, 41, 59, 0.75)),
                url("https://images.pexels.com/photos/7464707/pexels-photo-7464707.jpeg");
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    min-height: 85vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    color: white;
    padding: 40px 20px;
    margin-bottom: 60px;
}

.hero-content {
    max-width: 800px;
}

.hero h1 {
    font-size: clamp(36px, 5vw, 56px);
    margin-bottom: 20px;
    line-height: 1.2;
    text-shadow: 0 2px 10px rgba(0,0,0,0.3);
}

.hero p {
    font-size: clamp(18px, 2vw, 22px);
    margin-bottom: 35px;
    opacity: 0.95;
}

.hero-buttons {
    display: flex;
    gap: 20px;
    justify-content: center;
    flex-wrap: wrap;
}

.btn {
    padding: 14px 32px;
    border-radius: 12px;
    text-decoration: none;
    font-weight: 600;
    font-size: 17px;
    transition: var(--transition);
    border: none;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 8px;
}

.btn-primary {
    background: var(--primary);
    color: white;
    box-shadow: 0 8px 20px rgba(40, 199, 111, 0.3);
}

.btn-primary:hover {
    background: var(--primary-dark);
    transform: translateY(-3px);
    box-shadow: 0 12px 25px rgba(40, 199, 111, 0.4);
}

.btn-outline {
    background: transparent;
    color: white;
    border: 2px solid white;
}

.btn-outline:hover {
    background: white;
    color: var(--secondary);
    transform: translateY(-3px);
}

.container {
    width: 92%;
    max-width: 1200px;
    margin: 0 auto;
}

.section {
    padding: 70px 0;
}

.section-title {
    text-align: center;
    font-size: clamp(28px, 3vw, 36px);
    margin-bottom: 50px;
    position: relative;
    color: var(--secondary);
}

.section-title::after {
    content: '';
    position: absolute;
    bottom: -12px;
    left: 50%;
    transform: translateX(-50%);
    width: 80px;
    height: 4px;
    background: var(--primary);
    border-radius: 2px;
}

.items-grid {
    display: grid;
    grid-template-columns: 1fr 1fr; /* 2 coloane egale */
    gap: 15px;
    margin-bottom: 15px;
}


.card {
    background: white;
    padding: 35px;
    border-radius: 20px;
    box-shadow: var(--shadow);
    transition: var(--transition);
    border: 1px solid rgba(226, 232, 240, 0.8);
    position: relative;
    overflow: hidden;
}

.card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 5px;
    background: linear-gradient(90deg, var(--primary), #34d399);
}

.card:hover {
    transform: translateY(-5px);
    box-shadow: var(--shadow-lg);
}

.card h3 {
    font-size: 24px;
    margin-bottom: 25px;
    color: var(--secondary);
    display: flex;
    align-items: center;
    gap: 12px;
}

.card h3 i {
    color: var(--primary);
    font-size: 26px;
}

.section-title-items {
    font-size: 18px;
    font-weight: 600;
    color: var(--secondary);
    margin: 25px 0 12px;
    padding-bottom: 6px;
    border-bottom: 2px solid #f0f0f0;
    display: flex;
    align-items: center;
    gap: 8px;
}

.section-title-items i {
    color: var(--primary);
}

.items-grid {
    display: grid;
    grid-template-columns: 1fr 1fr; /* 2 coloane egale */
    gap: 12px;
    margin-bottom: 10px;
}

/* Stiluri noi pentru butoane + / - */
.item-control {
    background: #f8fafc;
    border: 2px solid transparent;
    padding: 12px 10px;
    border-radius: 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    transition: var(--transition);
}

.item-control:hover {
    border-color: var(--primary);
    background: #f0fdf4;
}

.item-name {
    font-size: 13px;
    font-weight: 500;
    text-align: center;
    color: var(--secondary);
}

.item-name i {
    color: var(--primary);
    margin-right: 4px;
}

.item-buttons {
    display: flex;
    align-items: center;
    gap: 10px;
}

.btn-minus, .btn-plus {
    width: 30px;
    height: 30px;
    border-radius: 6px;
    border: none;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: var(--transition);
}

.btn-minus {
    background: #ef4444;
    color: white;
}

.btn-minus:hover {
    background: #dc2626;
    transform: scale(1.1);
}

.btn-plus {
    background: var(--primary);
    color: white;
}

.btn-plus:hover {
    background: var(--primary-dark);
    transform: scale(1.1);
}

.item-count {
    min-width: 26px;
    text-align: center;
    font-weight: bold;
    font-size: 16px;
    color: var(--secondary);
}

.extra-services {
    margin: 25px 0;
    padding: 18px;
    background: #f8fafc;
    border-radius: 12px;
    border: 1px solid var(--light-gray);
}

.service-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin: 15px 0;
    gap: 15px;
    flex-wrap: wrap;
}

.service-label {
    font-weight: 500;
    color: var(--secondary);
    display: flex;
    align-items: center;
    gap: 8px;
}

.service-price {
    font-weight: 600;
    color: var(--primary-dark);
}

.input-sm {
    width: 80px;
    padding: 8px;
    text-align: center;
    margin: 0;
    border: 2px solid var(--light-gray);
    border-radius: 6px;
}

.packing-note {
    font-size: 13px;
    color: var(--gray);
    margin-top: 8px;
    font-style: italic;
}

.extra-items {
    margin-top: 20px;
    padding: 15px;
    background: #f8fafc;
    border-radius: 10px;
    border: 1px solid var(--light-gray);
}

.extra-items label {
    font-weight: 600;
    color: var(--secondary);
    margin-bottom: 8px;
    display: block;
}

.extra-items textarea {
    width: 100%;
    padding: 12px;
    border-radius: 8px;
    border: 1px solid var(--light-gray);
    font-size: 14px;
    resize: vertical;
    min-height: 80px;
    font-family: inherit;
}

.volume-display {
    background: #f0fdf4;
    padding: 18px;
    border-radius: 12px;
    margin: 20px 0;
    text-align: center;
    font-size: 19px;
    font-weight: 700;
    color: #166534;
    border: 2px solid #bbf7d0;
}

input, select {
    width: 100%;
    padding: 14px 16px;
    margin: 10px 0 20px;
    border-radius: 10px;
    border: 2px solid var(--light-gray);
    font-size: 15px;
    transition: var(--transition);
    background: white;
}

input:focus, select:focus, textarea:focus {
    outline: none;
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(40, 199, 111, 0.1);
}

.result-box {
    background: linear-gradient(135deg, #f0fdf4, #ecfccb);
    padding: 22px;
    border-radius: 14px;
    border-left: 5px solid var(--primary);
}

.result-row {
    display: flex;
    justify-content: space-between;
    margin: 10px 0;
    font-size: 17px;
}

.result-row.extra {
    color: #15803d;
    font-style: italic;
}

.result-row.total {
    font-size: 22px;
    font-weight: 700;
    color: #166534;
    margin-top: 15px;
    padding-top: 15px;
    border-top: 2px dashed #bbf7d0;
}

.calendar-container {
    background: #f8fafc;
    border-radius: 14px;
    padding: 20px;
    margin: 20px 0;
    border: 2px solid var(--light-gray);
}

.calendar-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 15px;
}

.calendar-nav {
    background: var(--primary);
    color: white;
    border: none;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 16px;
    transition: var(--transition);
    display: flex;
    align-items: center;
    justify-content: center;
}

.calendar-nav:hover {
    background: var(--primary-dark);
    transform: scale(1.1);
}

.calendar-title {
    font-size: 18px;
    font-weight: 600;
    color: var(--secondary);
}

.weekdays {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 4px;
    margin-bottom: 8px;
}

.weekday {
    text-align: center;
    font-weight: 600;
    font-size: 13px;
    color: var(--gray);
    padding: 6px;
}

.calendar {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 6px;
}

.day {
    background: white;
    padding: 12px 6px;
    font-size: 14px;
    text-align: center;
    border-radius: 8px;
    cursor: pointer;
    transition: var(--transition);
    font-weight: 500;
    border: 1px solid transparent;
    position: relative;
}

.day.other-month {
    color: #cbd5e1;
    background: #f1f5f9;
    cursor: default;
}

.day.today {
    border-color: #3b82f6;
    background: #eff6ff;
}

.day:hover:not(.unavailable):not(.other-month) {
    border-color: var(--primary);
    background: #f0fdf4;
    transform: scale(1.05);
}

.day.selected {
    background: var(--primary);
    color: white;
    transform: scale(1.08);
    box-shadow: 0 4px 12px rgba(40, 199, 111, 0.3);
}

.day.unavailable {
    opacity: 0.4;
    cursor: not-allowed;
    background: #f1f5f9;
    text-decoration: line-through;
}

.book-btn {
    width: 100%;
    padding: 16px;
    background: var(--primary);
    color: white;
    border: none;
    border-radius: 12px;
    font-size: 18px;
    font-weight: 600;
    cursor: pointer;
    transition: var(--transition);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-top: 15px;
}

.book-btn:hover {
    background: var(--primary-dark);
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(40, 199, 111, 0.3);
}

.success-msg {
    display: none;
    background: #f0fdf4;
    color: #166534;
    padding: 18px;
    border-radius: 12px;
    text-align: center;
    margin-top: 20px;
    font-weight: 600;
    border: 2px solid #bbf7d0;
}

.services-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 30px;
    margin-top: 40px;
}

.service-card {
    background: white;
    padding: 30px;
    border-radius: 16px;
    text-align: center;
    box-shadow: var(--shadow);
    transition: var(--transition);
}

.service-card:hover {
    transform: translateY(-5px);
    box-shadow: var(--shadow-lg);
}

.service-icon {
    width: 80px;
    height: 80px;
    background: #f0fdf4;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 20px;
}

.service-icon i {
    font-size: 36px;
    color: var(--primary);
}

.service-card h4 {
    font-size: 20px;
    margin-bottom: 12px;
    color: var(--secondary);
}

.service-card p {
    color: var(--gray);
    line-height: 1.7;
}

.contact-card {
    background: white;
    padding: 40px;
    border-radius: 20px;
    box-shadow: var(--shadow);
    text-align: center;
}

.contact-info {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 30px;
    margin-top: 30px;
}

.contact-item {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 15px;
    font-size: 18px;
    color: var(--secondary);
}

.contact-item i {
    font-size: 24px;
    color: var(--primary);
    width: 50px;
    height: 50px;
    background: #f0fdf4;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
}

.whatsapp {
    position: fixed;
    right: 25px;
    bottom: 25px;
    width: 65px;
    height: 65px;
    background: #25D366;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-size: 30px;
    box-shadow: 0 8px 25px rgba(37, 211, 102, 0.4);
    transition: var(--transition);
    z-index: 999;
}

.whatsapp:hover {
    transform: scale(1.15);
    box-shadow: 0 12px 30px rgba(37, 211, 102, 0.5);
}

footer {
    background: var(--secondary);
    color: white;
    padding: 40px 0 20px;
    margin-top: 60px;
}

.footer-content {
    text-align: center;
    margin-bottom: 20px;
}

.footer-bottom {
    text-align: center;
    padding-top: 20px;
    border-top: 1px solid #334155;
    color: #94a3b8;
    font-size: 14px;
}

@media(max-width: 900px) {
    .dashboard {
        grid-template-columns: 1fr;
    }
    .nav-links { gap: 15px; }
    .logo { font-size: 20px; }
    .card { padding: 25px; }
}

@media(max-width: 600px) {
    .nav-links a { font-size: 14px; }
    .hero h1 { font-size: 32px; }
    .service-row { flex-direction: column; align-items: flex-start; }
}
</style>
</head>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ADM Moving LTD</title>

<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>

<!-- HERO -->
<section class="hero" id="home">
    <div class="hero-content">
        <h1>Professional Moving Services</h1>
        <p>Get instant quotes, book online and move with confidence across the UK</p>
        <div class="hero-buttons">
            <a href="#dash">Get Quote</a>
            <a href="#contact">Contact</a>
        </div>
    </div>
</section>

<section id="dash" class="section">
<div class="container">
<div class="dashboard">

<!-- LEFT -->
<div class="card">
    <h3>Moving Cost Calculator</h3>

    <div class="item-control">
        <span>Sofa</span>
        <div class="item-buttons">
            <button class="btn-minus" data-volume="3" data-name="Sofa">−</button>
            <span class="item-count">0</span>
            <button class="btn-plus" data-volume="3" data-name="Sofa">+</button>
        </div>
    </div>

    <div class="item-control">
        <span>TV</span>
        <div class="item-buttons">
            <button class="btn-minus" data-volume="1.5" data-name="TV">−</button>
            <span class="item-count">0</span>
            <button class="btn-plus" data-volume="1.5" data-name="TV">+</button>
        </div>
    </div>

    <input id="distance" type="number" placeholder="Distance" oninput="calc()">

    <select id="van" onchange="calc()">
        <option value="1">Small</option>
        <option value="1.3">Medium</option>
        <option value="1.6">Large</option>
    </select>

    <div>
        Volume: <span id="vol">0</span> m³
    </div>

    <div>
        Total: £<span id="total">0</span>
    </div>
</div>

<!-- RIGHT -->
<div class="card">
    <h3>Book Your Move</h3>

    <input id="name" placeholder="Name">
    <input id="phone" placeholder="Phone">
    <input id="email" placeholder="Email">

    <div id="calendar"></div>

    <button onclick="book()">Confirm Booking</button>

    <div id="msg" style="display:none;color:green;">
        Booking sent successfully
    </div>
</div>

</div>
</div>
</section>

<!-- CONTACT -->
<section id="contact">
    <h2>Contact</h2>
</section>

<script>
let vol = 0;
let base = 0;
let itemCounts = {};
let currentDate = new Date();
let selectedDate = null;

const PRICE_PER_MILE = 1.5;

// ITEM CLICK
document.addEventListener("click", function(e) {
    const btn = e.target;
    if (!btn.classList.contains("btn-plus") && !btn.classList.contains("btn-minus")) return;

    const name = btn.dataset.name;
    const volume = parseFloat(btn.dataset.volume);

    if (!itemCounts[name]) itemCounts[name] = 0;

    const countEl = btn.parentElement.querySelector(".item-count");

    if (btn.classList.contains("btn-plus")) {
        itemCounts[name]++;
        vol += volume;
        base += volume * 45;
    } else if (itemCounts[name] > 0) {
        itemCounts[name]--;
        vol -= volume;
        base -= volume * 45;
    }

    countEl.textContent = itemCounts[name];
    calc();
});

// CALC
function calc() {
    let d = parseFloat(document.getElementById("distance").value) || 0;
    let v = parseFloat(document.getElementById("van").value) || 1;

    let total = (base + (d * PRICE_PER_MILE)) * v;

    document.getElementById("vol").innerText = vol.toFixed(1);
    document.getElementById("total").innerText = total.toFixed(0);
}

// CALENDAR
function renderCalendar() {
    const cal = document.getElementById("calendar");
    cal.innerHTML = "";

    const year = currentDate.getFullYear();
    const month = currentDate.getMonth();

    const days = new Date(year, month + 1, 0).getDate();

    for (let i = 1; i <= days; i++) {
        const day = document.createElement("div");
        day.textContent = i;

        const date = new Date(year, month, i);
        const today = new Date();
        today.setHours(0,0,0,0);

        if (date < today) {
            day.style.opacity = "0.3";
        } else {
            day.onclick = () => {
                selectedDate = date;
                renderCalendar();
            };
        }

        if (selectedDate && selectedDate.getDate() === i) {
            day.style.background = "#4CAF50";
            day.style.color = "#fff";
        }

        cal.appendChild(day);
    }
}

// BOOK
function book() {
    const name = document.getElementById("name").value;
    const phone = document.getElementById("phone").value;

    if (!name || !phone || !selectedDate) {
        alert("Fill all fields + select date");
        return;
    }

    document.getElementById("msg").style.display = "block";
}

window.onload = function() {
    renderCalendar();
    calc();
};
</script>

</body>
</html>
